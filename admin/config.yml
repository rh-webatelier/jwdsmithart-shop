backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

site_url: https://jwdsmithart.co.uk
display_url: https://jwdsmithart.co.uk

collections:
  - name: "paintings"
    label: "Paintings"
    files:
      - name: "paintings"
        label: "Paintings for Sale"
        file: "content/paintings.json"
        description: "Add, remove or reorder paintings that are currently available. When one sells through the site, it moves itself to Sold Works automatically. To mark one sold by hand, use Manage Paintings (link at the top of the editor) instead of deleting it here — that keeps the price, photo and description together."
        fields:
          - { label: "Paintings", name: "paintings", widget: "list", collapsed: true, summary: "{{title}} — £{{price}} ({{category}})", fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Slug (leave blank — fills in automatically)", name: "slug", widget: "string", required: false, pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase letters, numbers and single hyphens only, e.g. sunset-over-the-moors"], hint: "Only needed if you want to rename a painting without breaking its Buy button — leave empty for new paintings." },
              { label: "Photo", name: "image", widget: "image", hint: "Keep the file under ~1MB (resize to about 1600px wide) — very large phone photos can fail to upload." },
              { label: "Medium & size", name: "medium", widget: "string", hint: "e.g. Oil on canvas · 60 × 45 cm" },
              { label: "Price (£)", name: "price", widget: "number", value_type: "int", min: 1, hint: "Must be at least £1 — a blank or £0 price will stop the Buy button from working." },
              { label: "Category", name: "category", widget: "string", required: false, hint: "Type any category name, e.g. \"Yorkshire Dales & Moors\" or \"Yorkshire Coast\". Visitors can filter by this on the site. Type a new name to create a new category, or leave blank for none. Spell it exactly the same across paintings you want grouped together." },
              { label: "Description", name: "description", widget: "text", required: false, hint: "A sentence or two about the piece — shown when a visitor clicks to zoom in on the painting." },
              { label: "Stripe Buy Link", name: "stripe_link", widget: "string", required: false, hint: "Paste the Stripe Payment Link for this painting. Leave blank until Stripe is set up." }
            ] }
      - name: "paintings_sold"
        label: "Sold Works"
        file: "content/paintings-sold.json"
        description: "Paintings that have already sold. New sales land here on their own after a Stripe payment — use this list only to seed in older sold pieces or fix one by hand."
        fields:
          - { label: "Sold paintings", name: "paintings", widget: "list", collapsed: true, summary: "{{title}} — £{{price}}", fields: [
              { label: "Title", name: "title", widget: "string" },
              { label: "Slug", name: "slug", widget: "string", required: false, pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase letters, numbers and single hyphens only"] },
              { label: "Photo", name: "image", widget: "image" },
              { label: "Medium & size", name: "medium", widget: "string", required: false },
              { label: "Price (£)", name: "price", widget: "number", value_type: "int", required: false, min: 1 }
            ] }

  - name: "site_text"
    label: "Site Text"
    files:
      - name: "site_text"
        label: "Homepage Text"
        file: "content/site.json"
        description: "Edit the wording on the homepage. Photos and paintings are edited separately."
        fields:
          - { label: "Hero — badge (top pill)", name: "hero_badge", widget: "string" }
          - { label: "Hero — title", name: "hero_title", widget: "string" }
          - { label: "Hero — intro paragraph", name: "hero_lead", widget: "text" }
          - { label: "Artist's statement (quote)", name: "statement_quote", widget: "text" }
          - { label: "Paintings section — intro paragraph", name: "paintings_intro", widget: "text" }
          - { label: "About — paragraph 1", name: "about_p1", widget: "text" }
          - { label: "About — paragraph 2", name: "about_p2", widget: "text" }
          - { label: "Commissions — intro", name: "commissions_intro", widget: "text" }
          - { label: "Commissions — bullet 1", name: "commissions_li1", widget: "string" }
          - { label: "Commissions — bullet 2", name: "commissions_li2", widget: "string" }
          - { label: "Commissions — bullet 3", name: "commissions_li3", widget: "string" }
          - { label: "Prints — intro", name: "prints_intro", widget: "text" }
          - { label: "Prints — bullet 1", name: "prints_li1", widget: "string" }
          - { label: "Prints — bullet 2", name: "prints_li2", widget: "string" }
          - { label: "Prints — bullet 3", name: "prints_li3", widget: "string" }
          - { label: "Delivery FAQ — packaging answer", name: "faq_delivery_a", widget: "text" }
          - { label: "Delivery FAQ — returns answer", name: "faq_returns_a", widget: "text" }
          - { label: "Contact — intro paragraph", name: "contact_lead", widget: "text" }
